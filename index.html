<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Google Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Google</h1>

        <div class="search-box">
            <span>+</span>
            <input type="text">
            <!-- Microphone icon -->
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" />
                <path d="M19 11a7 7 0 0 1-14 0" />
                <path d="M12 18v4m-4 0h8" />
            </svg>

            <!-- Google Lens icon -->
            <svg class="camera-icon" viewBox="0 0 24 24">
                <path d="M4 7h4l2-3h4l2 3h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" />
                <circle cx="12" cy="13" r="4" />
            </svg>
            <button>AI Mode</button>
        </div>

        <div class="buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>

        <p>
            Google offered in:
            <a href="#">Hausa</a>
            <a href="#">Igbo</a>
            <a href="#">Èdè Yorùbá</a>
            <a href="#">Nigerian Pidgin</a>
        </p>

    </div>

</body>

</html>
